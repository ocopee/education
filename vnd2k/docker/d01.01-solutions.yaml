name: ocop

services:
  ocop_postgres:
    image: 'postgres:latest'
    container_name: ocop-postgres
    environment:
      POSTGRES_USER: "ocop"
      POSTGRES_PASSWORD: "thisispassword"
      POSTGRES_DB: "supertokens"
    ports:
      - 5433:5432
    networks:
      - ocop_net
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'ocop', '-d', 'supertokens']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

  ocop_supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: ocop-supertokens
    depends_on:
      ocop_postgres:
        condition: service_healthy
    ports:
      - 3567:3567
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://ocop:thisispassword@ocop-postgres:5432/supertokens"
    networks:
      - ocop_net
    restart: unless-stopped
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ocop_net:
